name: Build Server Binaries

# Builds ingest + github-app as standalone Bun binaries and the web app as a
# Node.js tarball, then publishes them to GitHub Releases on tag pushes.
# See docs/deploy/binaries.md for the deployment runbook.

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    paths:
      - 'apps/ingest/**'
      - 'apps/github-app/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/package-web.sh'
      - '.github/workflows/build-binaries.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build server binaries (ingest + github-app) ─────────────────────────────
  # Each app is cross-compiled for 4 targets. NODE_ENV=production is set at
  # compile time so pino doesn't try to load its pino-pretty transport (which
  # uses worker threads incompatible with Bun's --compile virtual filesystem).
  build-server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: ingest
            target: darwin-arm64
            runner: macos-14
            bun_target: bun-darwin-arm64
          - app: ingest
            target: darwin-x64
            runner: macos-13
            bun_target: bun-darwin-x64
          - app: ingest
            target: linux-x64
            runner: ubuntu-24.04
            bun_target: bun-linux-x64
          - app: ingest
            target: linux-arm64
            runner: ubuntu-24.04-arm
            bun_target: bun-linux-arm64
          - app: github-app
            target: darwin-arm64
            runner: macos-14
            bun_target: bun-darwin-arm64
          - app: github-app
            target: darwin-x64
            runner: macos-13
            bun_target: bun-darwin-x64
          - app: github-app
            target: linux-x64
            runner: ubuntu-24.04
            bun_target: bun-linux-x64
          - app: github-app
            target: linux-arm64
            runner: ubuntu-24.04-arm
            bun_target: bun-linux-arm64

    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.app }} (${{ matrix.target }})
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # keytar (a packages/auth dep) falls back to node-gyp rebuild on Linux.
      - name: Install native build deps (keytar → libsecret)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        run: |
          mkdir -p apps/${{ matrix.app }}/dist
          NODE_ENV=production bun build apps/${{ matrix.app }}/src/index.ts \
            --compile \
            --target ${{ matrix.bun_target }} \
            --outfile apps/${{ matrix.app }}/dist/${{ matrix.app }}-server-${{ matrix.target }}
          # Stamp the commit hash into the binary's metadata so /health reports
          # a real git_sha instead of the 'dev' default.
          # (Bun --compile doesn't support --define for process.env, so the
          # binary reads GIT_SHA at runtime — set it in the deployment env.)

      - name: Smoke test
        # Run on native targets only (where the binary can execute):
        # darwin-arm64 on macos-14, darwin-x64 on macos-13, linux-* on ubuntu.
        if: |
          (runner.os == 'Linux') ||
          (runner.os == 'macOS' && matrix.target == 'darwin-arm64') ||
          (runner.os == 'macOS' && matrix.target == 'darwin-x64')
        run: |
          chmod +x apps/${{ matrix.app }}/dist/${{ matrix.app }}-server-${{ matrix.target }}
          # Start the binary in the background, wait for it to boot, curl /health,
          # then kill it. This verifies the binary actually runs and serves HTTP,
          # not just that it doesn't crash within 3 seconds.
          BINARY="apps/${{ matrix.app }}/dist/${{ matrix.app }}-server-${{ matrix.target }}"
          PORT=$((RANDOM % 1000 + 14000))

          DATABASE_URL=postgresql://x:x@localhost:5432/x \
          S3_ENDPOINT=http://localhost:9000 \
          S3_ACCESS_KEY_ID=x S3_SECRET_ACCESS_KEY=x S3_BUCKET=x S3_REGION=us-east-1 \
          S3_FORCE_PATH_STYLE=true \
          INGEST_PORT=${PORT} \
          GITHUB_APP_PORT=${PORT} \
          GIT_SHA=$(git rev-parse --short HEAD) \
          ./"${BINARY}" &
          PID=$!

          # Wait up to 5s for the server to boot
          for i in $(seq 1 50); do
            if curl -sf "http://localhost:${PORT}/health" >/dev/null 2>&1; then
              echo "Health check passed"
              kill "${PID}" 2>/dev/null || true
              wait "${PID}" 2>/dev/null || true
              exit 0
            fi
            sleep 0.1
          done

          echo "Health check failed — binary did not respond within 5s" >&2
          kill "${PID}" 2>/dev/null || true
          wait "${PID}" 2>/dev/null || true
          exit 1

      - name: Report binary size
        run: ls -lh apps/${{ matrix.app }}/dist/${{ matrix.app }}-server-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app }}-server-${{ matrix.target }}
          path: apps/${{ matrix.app }}/dist/${{ matrix.app }}-server-${{ matrix.target }}
          retention-days: 30

  # ── Build web tarball ───────────────────────────────────────────────────────
  # Next.js standalone bundle + static assets, packaged as a .tar.gz.
  # The target machine needs Node >= 24 — no Bun, no node_modules, no build step.
  build-web:
    runs-on: ubuntu-24.04
    name: Build web tarball
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # for git describe

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web tarball
        run: bash scripts/package-web.sh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-tarball
          path: dist/web-standalone-*.tar.gz
          retention-days: 30

  # ── Release: publish to GitHub Releases on tag pushes ───────────────────────
  release:
    needs: [build-server, build-web]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist/

      - name: Flatten and prepare
        run: |
          mkdir -p release/
          # Server binaries
          find dist/ -name '*-server-*' -type f ! -name '*.sha256' -exec cp {} release/ \;
          # Web tarball
          find dist/ -name 'web-standalone-*.tar.gz' -exec cp {} release/ \;
          ls -lh release/

      - name: Generate SHA256SUMS
        working-directory: release/
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
            release/SHA256SUMS
          body: |
            ## Server binaries + web tarball — ${{ github.ref_name }}

            ### Server binaries (Bun compiled)
            - `ingest-server-<target>` — ingest API, standalone binary (~70 MB)
            - `github-app-server-<target>` — GitHub App webhook handler, standalone binary (~67 MB)
            - Targets: `darwin-arm64`, `darwin-x64`, `linux-x64`, `linux-arm64`
            - No runtime dependencies — just set env vars and run.

            ### Web tarball
            - `web-standalone-<version>.tar.gz` — Next.js standalone bundle (~16 MB)
            - Requires Node >= 24 on the target machine.
            - Extract and run `./run.sh`.

            ### Verify
            ```bash
            sha256sum -c SHA256SUMS --ignore-missing
            ```

            See [docs/deploy/binaries.md](../../docs/deploy/binaries.md) for full instructions.
