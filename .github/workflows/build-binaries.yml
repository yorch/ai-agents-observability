name: Build Server Binaries

# Builds ingest + github-app as standalone Bun binaries and the web app as a
# Node.js tarball. Release runs are explicitly dispatched at a version tag by
# release.yml; pull requests still validate affected build paths.
# See docs/deploy/binaries.md for the deployment runbook.

run-name: "${{ inputs.release_run_id && format('{0} · release {1}', inputs.release_tag, inputs.release_run_id) || github.event.pull_request.title || github.event.head_commit.message || github.workflow }}"

on:
  pull_request:
    paths:
      - 'apps/ingest/**'
      - 'apps/github-app/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/package-web.sh'
      - '.github/workflows/build-binaries.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag whose source and draft release this run targets
        required: true
        type: string
      release_run_id:
        description: Release workflow run coordinating this build
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: build-binaries-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build server binaries (ingest + github-app) ─────────────────────────────
  # Each app is cross-compiled for 4 targets. NODE_ENV=production is set at
  # compile time so pino doesn't try to load its pino-pretty transport (which
  # uses worker threads incompatible with Bun's --compile virtual filesystem).
  build-server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: ingest
            target: darwin-arm64
            runner: macos-14
            bun_target: bun-darwin-arm64
          - app: ingest
            target: darwin-x64
            runner: macos-15-intel
            bun_target: bun-darwin-x64
          - app: ingest
            target: linux-x64
            runner: ubuntu-24.04
            bun_target: bun-linux-x64
          - app: ingest
            target: linux-arm64
            runner: ubuntu-24.04-arm
            bun_target: bun-linux-arm64
          - app: github-app
            target: darwin-arm64
            runner: macos-14
            bun_target: bun-darwin-arm64
          - app: github-app
            target: darwin-x64
            runner: macos-15-intel
            bun_target: bun-darwin-x64
          - app: github-app
            target: linux-x64
            runner: ubuntu-24.04
            bun_target: bun-linux-x64
          - app: github-app
            target: linux-arm64
            runner: ubuntu-24.04-arm
            bun_target: bun-linux-arm64

    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.app }} (${{ matrix.target }})
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # keytar (a packages/auth dep) falls back to node-gyp rebuild on Linux.
      - name: Install native build deps (keytar → libsecret)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        run: |
          mkdir -p apps/${{ matrix.app }}/dist
          NODE_ENV=production bun build apps/${{ matrix.app }}/src/index.ts \
            --compile \
            --target ${{ matrix.bun_target }} \
            --outfile apps/${{ matrix.app }}/dist/${{ matrix.app }}-server-${{ matrix.target }}
          # Stamp the commit hash into the binary's metadata so /health reports
          # a real git_sha instead of the 'dev' default.
          # (Bun --compile doesn't support --define for process.env, so the
          # binary reads GIT_SHA at runtime — set it in the deployment env.)

      - name: Smoke test
        # Run on native targets only (where the binary can execute):
        # darwin-arm64 on macos-14, darwin-x64 on macos-15-intel, linux-* on ubuntu.
        if: |
          (runner.os == 'Linux') ||
          (runner.os == 'macOS' && matrix.target == 'darwin-arm64') ||
          (runner.os == 'macOS' && matrix.target == 'darwin-x64')
        run: |
          chmod +x apps/${{ matrix.app }}/dist/${{ matrix.app }}-server-${{ matrix.target }}
          # Start the binary in the background, wait for it to boot, curl /health,
          # then kill it. This verifies the binary actually runs and serves HTTP,
          # not just that it doesn't crash within 3 seconds.
          BINARY="apps/${{ matrix.app }}/dist/${{ matrix.app }}-server-${{ matrix.target }}"
          PORT=$((RANDOM % 1000 + 14000))

          # Common env vars for both apps
          export DATABASE_URL=postgresql://x:x@localhost:5432/x
          export GIT_SHA=$(git rev-parse --short HEAD)

          # ingest requires S3 config; github-app requires GitHub App config.
          # Provide dummy values so config validation passes — the binary will
          # start and serve /health (which does no DB or API work) even though
          # the credentials are fake.
          if [ "${{ matrix.app }}" = "ingest" ]; then
            export S3_ENDPOINT=http://localhost:9000
            export S3_ACCESS_KEY_ID=x
            export S3_SECRET_ACCESS_KEY=x
            export S3_BUCKET=x
            export S3_REGION=us-east-1
            export S3_FORCE_PATH_STYLE=true
            export INGEST_PORT=${PORT}
          else
            export GITHUB_APP_ID=1
            export GITHUB_APP_PRIVATE_KEY=dGVzdA==
            export GITHUB_APP_WEBHOOK_SECRET=test
            export GITHUB_APP_PORT=${PORT}
          fi

          ./"${BINARY}" &
          PID=$!

          # Wait up to 5s for the server to boot
          for i in $(seq 1 50); do
            if curl -sf "http://localhost:${PORT}/health" >/dev/null 2>&1; then
              echo "Health check passed"
              kill "${PID}" 2>/dev/null || true
              wait "${PID}" 2>/dev/null || true
              exit 0
            fi
            sleep 0.1
          done

          echo "Health check failed — binary did not respond within 5s" >&2
          kill "${PID}" 2>/dev/null || true
          wait "${PID}" 2>/dev/null || true
          exit 1

      - name: Report binary size
        run: ls -lh apps/${{ matrix.app }}/dist/${{ matrix.app }}-server-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app }}-server-${{ matrix.target }}
          path: apps/${{ matrix.app }}/dist/${{ matrix.app }}-server-${{ matrix.target }}
          retention-days: 30

  # ── Build web tarball ───────────────────────────────────────────────────────
  # Next.js standalone bundle + static assets, packaged as a .tar.gz.
  # The target machine needs Node >= 24 — no Bun, no node_modules, no build step.
  build-web:
    runs-on: ubuntu-24.04
    name: Build web tarball
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # for git describe
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web tarball
        run: bash scripts/package-web.sh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-tarball
          path: dist/web-standalone-*.tar.gz
          retention-days: 30

  # ── Release: publish to the draft GitHub Release ────────────────────────────
  release:
    needs: [build-server, build-web]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/

      - name: Flatten and prepare
        run: |
          mkdir -p release/
          # Server binaries
          find dist/ -name '*-server-*' -type f ! -name '*.sha256' -exec cp {} release/ \;
          # Web tarball
          find dist/ -name 'web-standalone-*.tar.gz' -exec cp {} release/ \;
          ls -lh release/

      - name: Generate SHA256SUMS-binaries
        working-directory: release/
        run: |
          sha256sum * > SHA256SUMS-binaries
          cat SHA256SUMS-binaries

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign SHA256SUMS-binaries (keyless via OIDC)
        working-directory: release/
        run: |
          cosign sign-blob --yes SHA256SUMS-binaries \
            --output-signature SHA256SUMS-binaries.sig \
            --output-certificate SHA256SUMS-binaries.crt
          echo "Signature:"
          cat SHA256SUMS-binaries.sig
          echo "Certificate:"
          cat SHA256SUMS-binaries.crt

      - name: Compute checksum digest for attestation
        id: digest
        working-directory: release/
        run: |
          DIGEST="sha256:$(sha256sum SHA256SUMS-binaries | cut -d' ' -f1)"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "Digest: ${DIGEST}"

      - name: Generate build provenance attestation
        uses: actions/attest@v4
        with:
          subject-name: ${RELEASE_TAG}-binaries
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: false

      - name: Upload to GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${RELEASE_TAG}" release/* --clobber
