name: Build Hook Binary

run-name: "${{ inputs.release_run_id && format('{0} · release {1}', inputs.release_tag, inputs.release_run_id) || github.event.pull_request.title || github.event.head_commit.message || github.workflow }}"

on:
  pull_request:
    paths:
      - 'apps/hook/**'
      - '.github/workflows/build-hook.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag whose source and draft release this run targets
        required: true
        type: string
      release_run_id:
        description: Release workflow run coordinating this build
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

concurrency:
  group: build-hook-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
            bun_target: bun-darwin-arm64
            rust_target: aarch64-apple-darwin
          - target: darwin-x64
            runner: macos-15-intel
            bun_target: bun-darwin-x64
            rust_target: x86_64-apple-darwin
          - target: linux-x64
            runner: ubuntu-24.04
            bun_target: bun-linux-x64
            rust_target: x86_64-unknown-linux-gnu
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            bun_target: bun-linux-arm64
            rust_target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.runner }}
    name: Build (${{ matrix.target }})

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # keytar (a packages/auth dep) falls back to `node-gyp rebuild` when its
      # prebuild-install download flakes; on Linux that source build needs
      # libsecret's pkg-config headers (macOS uses the native Keychain, no dep).
      - name: Install native build deps (keytar → libsecret)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build runtime (Bun) and launcher (Rust)
        run: |
          mkdir -p apps/hook/dist
          # 1. Bun-compiled runtime (~50–80 MB)
          bun build apps/hook/src/cli.ts \
            --compile \
            --target ${{ matrix.bun_target }} \
            --outfile apps/hook/dist/aiot-runtime-${{ matrix.target }}
          # 2. Rust launcher (~100 KB)
          cargo build --release --manifest-path apps/hook/launcher/Cargo.toml \
            --target ${{ matrix.rust_target }}
          cp apps/hook/launcher/target/${{ matrix.rust_target }}/release/aiot \
            apps/hook/dist/aiot-${{ matrix.target }}

      - name: Smoke test
        run: |
          chmod +x apps/hook/dist/aiot-${{ matrix.target }} apps/hook/dist/aiot-runtime-${{ matrix.target }}
          # The launcher execs the runtime, so this tests both in one go.
          apps/hook/dist/aiot-${{ matrix.target }} --version

      - name: Report binary sizes
        run: |
          ls -lh apps/hook/dist/aiot-${{ matrix.target }} apps/hook/dist/aiot-runtime-${{ matrix.target }}

      - name: Codesign (Mac only)
        if: runner.os == 'macOS'
        run: |
          # Sign the launcher — this is the binary launchd invokes, so its
          # signature is what macOS BTM reads for the "Developer Name" shown
          # in Login Items & Extensions. The runtime doesn't need signing
          # because it's never directly registered with launchd.
          bash apps/hook/scripts/codesign-mac.sh apps/hook/dist/aiot-${{ matrix.target }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aiot-${{ matrix.target }}
          path: |
            apps/hook/dist/aiot-${{ matrix.target }}
            apps/hook/dist/aiot-runtime-${{ matrix.target }}
          retention-days: 30

  # ── Release: publish binaries to the draft GitHub Release ───────────────────
  # Downloads all four per-target artifacts, generates a consolidated SHA256SUMS-hook,
  # and attaches binaries + checksums to the GitHub Release for the tag.
  # Mac binaries are already codesigned+notarized in the build job when Apple
  # secrets are present. See docs/deploy/hook-binary.md.
  release:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist/

      - name: Flatten and prepare binaries
        run: |
          mkdir -p release/
          find dist/ -name 'aiot-*' -type f -exec cp {} release/ \;
          ls -lh release/

      - name: Generate SHA256SUMS-hook
        working-directory: release/
        run: |
          sha256sum aiot-* aiot-runtime-* > SHA256SUMS-hook
          cat SHA256SUMS-hook

      - name: Upload to GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${RELEASE_TAG}" release/* --clobber
