name: Build Hook Binary

on:
  push:
    branches: [main]
    # Tag pushes trigger the release job (publishes binaries to GitHub Releases).
    tags:
      - "v*"
  pull_request:
    paths:
      - 'apps/hook/**'
      - '.github/workflows/build-hook.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
            bun_target: bun-darwin-arm64
          - target: darwin-x64
            runner: macos-13
            bun_target: bun-darwin-x64
          - target: linux-x64
            runner: ubuntu-24.04
            bun_target: bun-linux-x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            bun_target: bun-linux-arm64

    runs-on: ${{ matrix.runner }}
    name: Build (${{ matrix.target }})

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # keytar (a packages/auth dep) falls back to `node-gyp rebuild` when its
      # prebuild-install download flakes; on Linux that source build needs
      # libsecret's pkg-config headers (macOS uses the native Keychain, no dep).
      - name: Install native build deps (keytar → libsecret)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        run: |
          mkdir -p apps/hook/dist
          bun build apps/hook/src/cli.ts \
            --compile \
            --target ${{ matrix.bun_target }} \
            --outfile apps/hook/dist/claude-telemetry-${{ matrix.target }}

      - name: Smoke test
        run: |
          chmod +x apps/hook/dist/claude-telemetry-${{ matrix.target }}
          apps/hook/dist/claude-telemetry-${{ matrix.target }} --version

      - name: Report binary size
        run: |
          ls -lh apps/hook/dist/claude-telemetry-${{ matrix.target }}

      - name: Codesign (Mac only)
        if: runner.os == 'macOS'
        run: bash apps/hook/scripts/codesign-mac.sh apps/hook/dist/claude-telemetry-${{ matrix.target }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: claude-telemetry-${{ matrix.target }}
          path: apps/hook/dist/claude-telemetry-${{ matrix.target }}
          retention-days: 30

  # ── Release: publish binaries to GitHub Releases on tag pushes ──────────────
  # Downloads all four per-target artifacts, generates a consolidated SHA256SUMS-hook,
  # and attaches binaries + checksums to the GitHub Release for the tag.
  # Mac binaries are already codesigned+notarized in the build job (when Apple
  # secrets are present). Without those secrets, unsigned binaries are published
  # with a warning in the release notes. See docs/deploy/hook-binary.md.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist/

      - name: Flatten and prepare binaries
        run: |
          mkdir -p release/
          find dist/ -name 'claude-telemetry-*' -type f -exec cp {} release/ \;
          ls -lh release/

      - name: Generate SHA256SUMS-hook
        working-directory: release/
        run: |
          sha256sum claude-telemetry-* > SHA256SUMS-hook
          cat SHA256SUMS-hook

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/claude-telemetry-darwin-arm64
            release/claude-telemetry-darwin-x64
            release/claude-telemetry-linux-x64
            release/claude-telemetry-linux-arm64
            release/SHA256SUMS-hook
          body: |
            ## Hook binary release ${{ github.ref_name }}

            Download the binary for your platform and verify the checksum:

            ```bash
            sha256sum -c SHA256SUMS-hook --ignore-missing
            ```

            ### Mac binaries
            - **darwin-arm64** (Apple Silicon) and **darwin-x64** (Intel) are codesigned and notarized when Apple signing secrets are configured in the repo.
            - If the binaries are unsigned, remove the quarantine attribute before first run: `xattr -d com.apple.quarantine claude-telemetry-*`
            - See [docs/deploy/hook-binary.md](../../docs/deploy/hook-binary.md) for full instructions.

            ### Linux binaries
            - **linux-x64** and **linux-arm64** require no special handling.
            - Make the binary executable: `chmod +x claude-telemetry-*`
