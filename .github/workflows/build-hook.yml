name: Build Hook Binary

run-name: "${{ inputs.release_run_id && format('{0} · release {1}', inputs.release_tag, inputs.release_run_id) || github.event.pull_request.title || github.event.head_commit.message || github.workflow }}"

on:
  pull_request:
    paths:
      - 'apps/hook/**'
      - '.github/workflows/build-hook.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag whose source and draft release this run targets
        required: true
        type: string
      release_run_id:
        description: Release workflow run coordinating this build
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

concurrency:
  group: build-hook-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
            bun_target: bun-darwin-arm64
          - target: darwin-x64
            runner: macos-15-intel
            bun_target: bun-darwin-x64
          - target: linux-x64
            runner: ubuntu-24.04
            bun_target: bun-linux-x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            bun_target: bun-linux-arm64

    runs-on: ${{ matrix.runner }}
    name: Build (${{ matrix.target }})

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # keytar (a packages/auth dep) falls back to `node-gyp rebuild` when its
      # prebuild-install download flakes; on Linux that source build needs
      # libsecret's pkg-config headers (macOS uses the native Keychain, no dep).
      - name: Install native build deps (keytar → libsecret)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        run: |
          mkdir -p apps/hook/dist
          bun build apps/hook/src/cli.ts \
            --compile \
            --target ${{ matrix.bun_target }} \
            --outfile apps/hook/dist/claude-telemetry-${{ matrix.target }}

      - name: Smoke test
        run: |
          chmod +x apps/hook/dist/claude-telemetry-${{ matrix.target }}
          apps/hook/dist/claude-telemetry-${{ matrix.target }} --version

      - name: Report binary size
        run: |
          ls -lh apps/hook/dist/claude-telemetry-${{ matrix.target }}

      - name: Codesign (Mac only)
        if: runner.os == 'macOS'
        run: bash apps/hook/scripts/codesign-mac.sh apps/hook/dist/claude-telemetry-${{ matrix.target }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: claude-telemetry-${{ matrix.target }}
          path: apps/hook/dist/claude-telemetry-${{ matrix.target }}
          retention-days: 30

  # ── Release: publish binaries to the draft GitHub Release ───────────────────
  # Downloads all four per-target artifacts, generates a consolidated SHA256SUMS-hook,
  # and attaches binaries + checksums to the GitHub Release for the tag.
  # Mac binaries are already codesigned+notarized in the build job when Apple
  # secrets are present. See docs/deploy/hook-binary.md.
  release:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist/

      - name: Flatten and prepare binaries
        run: |
          mkdir -p release/
          find dist/ -name 'claude-telemetry-*' -type f -exec cp {} release/ \;
          ls -lh release/

      - name: Generate SHA256SUMS-hook
        working-directory: release/
        run: |
          sha256sum claude-telemetry-* > SHA256SUMS-hook
          cat SHA256SUMS-hook

      - name: Upload to GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${RELEASE_TAG}" release/* --clobber
