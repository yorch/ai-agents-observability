name: Build and Publish Docker Images

run-name: "${{ inputs.release_run_id && format('{0} · release {1}', inputs.release_tag, inputs.release_run_id) || github.event.pull_request.title || github.event.head_commit.message || github.workflow }}"

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag whose source and draft release this run targets
        required: true
        type: string
      release_run_id:
        description: Release workflow run coordinating this build
        required: true
        type: string
      update_floating_tags:
        description: Update major, major.minor, and latest tags
        required: true
        type: boolean

env:
  GHCR_PREFIX: ghcr.io/${{ github.repository }}
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  # arm64 is disabled, not removed. Re-enable with:
  # BUILD_PLATFORMS: linux/amd64,linux/arm64
  BUILD_PLATFORMS: linux/amd64

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The only per-repo edit: the publishable components. migrations-runner is a
  # one-shot job image (prisma migrate deploy + SQL); web is Next (node runtime),
  # ingest/github-app are bun services.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          MATRIX=$(echo '{"include":[
            {"component":"web","dockerfile":"apps/web/Dockerfile"},
            {"component":"ingest","dockerfile":"apps/ingest/Dockerfile"},
            {"component":"github-app","dockerfile":"apps/github-app/Dockerfile"},
            {"component":"migrations-runner","dockerfile":"infra/migrations-runner/Dockerfile"}
          ]}' | tr -d '\n')
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"

  build:
    needs: setup
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.component }} (no push)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ env.BUILD_PLATFORMS }}
          push: false
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  publish:
    needs: setup
    if: >-
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Cosign keyless signing and build provenance use GitHub OIDC.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to external registry
        if: vars.EXTERNAL_REGISTRY_URL != ''
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.EXTERNAL_REGISTRY_URL }}
          username: ${{ secrets.EXTERNAL_REGISTRY_USERNAME }}
          password: ${{ secrets.EXTERNAL_REGISTRY_PASSWORD }}

      - name: Build image list
        id: images
        env:
          GHCR_PREFIX: ${{ env.GHCR_PREFIX }}
          COMPONENT: ${{ matrix.component }}
          EXTERNAL_REGISTRY_URL: ${{ vars.EXTERNAL_REGISTRY_URL }}
          EXTERNAL_REGISTRY_IMAGE: ${{ vars.EXTERNAL_REGISTRY_IMAGE }}
        run: |
          IMAGES="${GHCR_PREFIX}/${COMPONENT}"
          if [[ -n "${EXTERNAL_REGISTRY_URL}" ]]; then
            BASE="${EXTERNAL_REGISTRY_IMAGE:-${GITHUB_REPOSITORY##*/}}"
            IMAGES="${IMAGES}"$'\n'"${EXTERNAL_REGISTRY_URL}/${BASE}-${COMPONENT}"
          fi
          {
            echo 'list<<EOF'
            echo "${IMAGES}"
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Get build info
        id: build-info
        run: |
          echo "branch=${GITHUB_REF_NAME}"                                                >> "${GITHUB_OUTPUT}"
          echo "build_number=${{ github.run_number }}"                                    >> "${GITHUB_OUTPUT}"
          echo "commit=$(git rev-parse --short HEAD)"                                     >> "${GITHUB_OUTPUT}"
          echo "tag=${RELEASE_TAG}"                                                  >> "${GITHUB_OUTPUT}"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"                                      >> "${GITHUB_OUTPUT}"
          echo "timestamp=$(git show -s --date=format:'%Y%m%d%H%M' --format=%cd)"         >> "${GITHUB_OUTPUT}"
          echo "version=$(git describe --tags --always)"                                  >> "${GITHUB_OUTPUT}"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.images.outputs.list }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.build-info.outputs.timestamp }}-${{ steps.build-info.outputs.commit }}
            type=raw,value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }},enable=${{ inputs.update_floating_tags }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }},enable=${{ inputs.update_floating_tags }}
            type=raw,value=latest,enable=${{ inputs.update_floating_tags }}

      - name: Build and push ${{ matrix.component }}
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ env.BUILD_PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.build-info.outputs.version }}
            BUILD_NUMBER=${{ steps.build-info.outputs.build_number }}
            BUILD_TIME=${{ steps.build-info.outputs.time }}
            COMMIT_HASH=${{ steps.build-info.outputs.commit }}
            GIT_BRANCH=${{ steps.build-info.outputs.branch }}
            GIT_TAG=${{ steps.build-info.outputs.tag }}
            GIT_TIMESTAMP=${{ steps.build-info.outputs.timestamp }}
            ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      # ── Supply-chain hardening ──────────────────────────────────────────────
      # SBOM (CycloneDX), image signing (cosign keyless via OIDC), and build
      # provenance. Verification instructions are in docs/deploy/README.md.
      # See docs/deploy/air-gapped.md for the offline verification path.

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.GHCR_PREFIX }}/${{ matrix.component }}:${{ steps.build-info.outputs.timestamp }}-${{ steps.build-info.outputs.commit }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.component }}-${{ env.RELEASE_TAG }}.json
          artifact-name: sbom-${{ matrix.component }}-${{ env.RELEASE_TAG }}.json
          upload-artifact: true
          upload-release-assets: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign images (keyless via OIDC)
        env:
          IMAGE_LIST: ${{ steps.meta.outputs.tags }}
        run: |
          # Sign each pushed tag. Keyless signing uses the GitHub OIDC token;
          # no long-lived signing key is needed. Signatures land in the GHCR
          # signature store. For external registries, the registry must support
          # the OCI signature referrers API.
          while IFS= read -r image; do
            [[ -z "${image}" ]] && continue
            echo "Signing ${image}..."
            cosign sign --yes "${image}"
          done <<< "${IMAGE_LIST}"

      - name: Generate build provenance attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.GHCR_PREFIX }}/${{ matrix.component }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ── Air-gapped release bundle ───────────────────────────────────────────────
  # On release builds, export each published image as an OCI archive (.tar) and
  # attach them + checksums + SBOMs to the GitHub Release. Air-gapped envs
  # download the bundle, verify checksums, `docker load`, and deploy with no
  # outbound network. See docs/deploy/air-gapped.md.
  release-bundle:
    needs: [setup, publish]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image ref
        id: ref
        env:
          GHCR_PREFIX: ${{ env.GHCR_PREFIX }}
          COMPONENT: ${{ matrix.component }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          # Use the git tag ref — the publish job pushes type=ref,event=tag.
          echo "image=${GHCR_PREFIX}/${COMPONENT}:${TAG}" >> "${GITHUB_OUTPUT}"
          echo "tarball=${COMPONENT}-${TAG}.tar" >> "${GITHUB_OUTPUT}"

      - name: Pull and save image
        run: |
          docker pull "${{ steps.ref.outputs.image }}"
          docker save "${{ steps.ref.outputs.image }}" -o "${{ steps.ref.outputs.tarball }}"

      - name: Generate checksum
        run: |
          sha256sum "${{ steps.ref.outputs.tarball }}" > "${{ steps.ref.outputs.tarball }}.sha256"

      - name: Download SBOM artifact
        uses: actions/download-artifact@v7
        with:
          name: sbom-${{ matrix.component }}-${{ env.RELEASE_TAG }}.json
          path: sbom/

      - name: Upload to GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ steps.ref.outputs.tarball }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            "${TARBALL}" \
            "${TARBALL}.sha256" \
            "sbom/sbom-${{ matrix.component }}-${RELEASE_TAG}.json" \
            --clobber

  # ── Consolidated checksums file ─────────────────────────────────────────────
  # After all release-bundle jobs finish, produce a single SHA256SUMS-images file
  # containing all tarball checksums and attach it to the release.
  release-checksums:
    needs: [setup, release-bundle]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Build consolidated SHA256SUMS-images
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          mkdir -p all-checksums/
          gh release download "${TAG}" --pattern "*.sha256" --dir all-checksums/
          cat all-checksums/*.sha256 > SHA256SUMS-images

      - name: Upload consolidated checksums
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${RELEASE_TAG}" SHA256SUMS-images --clobber
