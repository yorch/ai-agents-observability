name: Release

# Two-phase release process:
#
# 1. Push to main (non-release commits) → prepare-release job analyzes
#    conventional commits since the last tag, determines the next version,
#    generates a changelog, and opens/updates a "chore: release vX.Y.Z" PR.
#
# 2. Merging that PR → publish-release job re-runs the four quality gates
#    (check, typecheck, build, test), creates the vX.Y.Z tag pinned to the
#    merge commit, and creates a draft GitHub Release. It explicitly dispatches
#    the artifact workflows at that tag, waits for all of them, verifies every
#    expected asset, and only then publishes the release.
#
# Key invariant: nothing reaches a registry without human approval of the
# version number. The approval gate is merging the release PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to repair and republish
        required: true
        type: string
      update_floating_tags:
        description: Update major, major.minor, latest image tags and mark this release latest
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  packages: read
  pull-requests: write

jobs:
  # ── Phase 1: Prepare the release PR ─────────────────────────────────────────
  # Runs on every push to main that is NOT itself a release merge. Analyzes
  # conventional commits, generates a changelog, and opens or updates a PR
  # titled "chore: release vX.Y.Z". The PR is the human approval gate —
  # merging it triggers phase 2.
  prepare-release:
    if: "${{ github.event_name == 'push' && !contains(github.event.head_commit.message, 'chore: release v') }}"
    runs-on: ubuntu-latest
    outputs:
      has-release: ${{ steps.prepare.outputs.has-release }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # need full history for git log since last tag

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Prepare release
        id: prepare
        run: |
          set -euo pipefail
          OUTPUT=$(bash scripts/prepare-release.sh 2>/dev/null || true)
          if [[ -z "${OUTPUT}" ]]; then
            echo "Nothing to release — no feat/fix/perf/refactor commits since last tag." >&2
            echo 'has-release=false' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          VERSION=$(echo "${OUTPUT}" | head -1)
          BODY=$(echo "${OUTPUT}" | tail -n +2)
          TAG="v${VERSION}"
          TODAY=$(date +%Y-%m-%d)

          bun scripts/release-version.ts set "${VERSION}"
          bun install --lockfile-only --ignore-scripts
          bun scripts/release-version.ts check "${VERSION}"
          bun install --frozen-lockfile --lockfile-only --ignore-scripts

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo 'has-release=true' >> "${GITHUB_OUTPUT}"

          # Build the changelog entry
          {
            echo "## ${TAG} (${TODAY})"
            echo ""
            echo "${BODY}"
          } > ${RUNNER_TEMP}/changelog-entry.md

          # Insert the version entry AFTER the file header (title +
          # description) but BEFORE existing version entries. This keeps
          # "# Changelog" at the top and versions in reverse-chronological
          # order.
          if [[ -f CHANGELOG.md ]]; then
            # Split the file: header (everything up to the first "## " heading)
            # vs. the rest (existing version entries).
            HEADER=$(awk '/^## / { exit } { print }' CHANGELOG.md)
            REST=$(awk '/^## / { found=1 } found { print }' CHANGELOG.md)

            {
              echo "${HEADER}"
              echo ""
              cat ${RUNNER_TEMP}/changelog-entry.md
              if [[ -n "${REST}" ]]; then
                echo ""
                echo "${REST}"
              fi
            } > CHANGELOG.md
          else
            {
              echo "# Changelog"
              echo ""
              echo "All notable changes to this project are documented in this file."
              echo ""
              cat ${RUNNER_TEMP}/changelog-entry.md
            } > CHANGELOG.md
          fi

          # Save the tag and version for the commit
          echo "${TAG}" > ${RUNNER_TEMP}/release-tag
          echo "${VERSION}" > ${RUNNER_TEMP}/release-version

      - name: Create or update release branch
        if: steps.prepare.outputs.has-release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(cat ${RUNNER_TEMP}/release-tag)
          VERSION=$(cat ${RUNNER_TEMP}/release-version)
          BRANCH="release/${TAG}"

          # Git identity for the release commit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The release branch is bot-managed and regenerated from the
          # current HEAD each time, so force-push is safe — the CHANGELOG
          # content is deterministic for a given commit.
          git checkout -B "${BRANCH}"

          mapfile -t MANIFESTS < <(bun scripts/release-version.ts list)
          git add CHANGELOG.md bun.lock "${MANIFESTS[@]}"
          git commit -m "chore: release ${TAG}" || {
            echo "No changes to commit — changelog already up to date."
            exit 0
          }

          git push --force origin "${BRANCH}"

          # Check if a PR already exists for this branch
          PR_NUMBER=$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [[ -n "${PR_NUMBER}" ]]; then
            echo "Updating existing PR #${PR_NUMBER}"
            gh pr edit "${PR_NUMBER}" --body "Merging this PR will create the ${TAG} tag and publish all release artifacts (Docker images, server binaries, hook binaries, web tarball).

          See CHANGELOG.md for the full release notes."
          else
            gh pr create \
              --head "${BRANCH}" \
              --base main \
              --title "chore: release ${TAG}" \
              --body "Merging this PR will create the ${TAG} tag and publish all release artifacts (Docker images, server binaries, hook binaries, web tarball).

          See CHANGELOG.md for the full release notes.

          ### Pre-merge checklist
          - [ ] Version number is correct
          - [ ] Changelog entries are accurate
          - [ ] CI is green on this branch"
          fi

  # ── Phase 2: Publish the release ────────────────────────────────────────────
  # Runs when a release PR is merged to main, or manually to repair an existing
  # tag. Re-runs the four quality gates, creates a draft release, dispatches all
  # artifact workflows at the tag, and publishes only after they succeed.
  publish-release:
    if: "${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged && startsWith(github.event.pull_request.title, 'chore: release v') && startsWith(github.event.pull_request.head.ref, 'release/v') && github.event.pull_request.head.repo.full_name == github.repository) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.ref }}

      - name: Resolve release tag
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          RELEASE_PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${REQUESTED_TAG}"
          else
            TAG=$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' <<< "${RELEASE_PR_TITLE}" | head -1)
          fi

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${TAG}" >&2
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1 || {
              echo "Repair requires an existing tag: ${TAG}" >&2
              exit 1
            }
            git checkout --detach "${TAG}"
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Resolved tag: ${TAG}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Install native build deps (keytar → libsecret)
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify synchronized package versions
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: bun scripts/release-version.ts check "${TAG#v}"

      # Re-verify — publishing is irreversible (tag + release trigger artifact
      # workflows that push to GHCR and GitHub Releases), so it does not
      # inherit trust from the CI run on the same commit.
      - name: Quality gate — lint
        run: bun run check

      - name: Quality gate — typecheck
        run: bun run typecheck

      - name: Quality gate — build
        run: bun run build

      - name: Quality gate — test
        run: bun run test

      - name: Create or verify tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists."
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Repair requires an existing tag: ${TAG}" >&2
            exit 1
          fi

          git tag "${TAG}" HEAD
          git push origin "${TAG}"

      - name: Extract changelog notes
        id: notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Extract the section for this version from CHANGELOG.md
          # (from the "## vX.Y.Z" heading to the next "## " heading)
          awk -v tag="${TAG}" '
            /^## / {
              if (found) exit
              if ($2 == tag) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > ${RUNNER_TEMP}/release-notes.md

          if [[ ! -s ${RUNNER_TEMP}/release-notes.md ]]; then
            echo "Release ${TAG}" > ${RUNNER_TEMP}/release-notes.md
          fi

      - name: Create or prepare draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          TARGET_SHA=$(git rev-parse HEAD)

          if gh release view "${TAG}" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "${TAG}" --json isDraft --jq '.isDraft')
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo "Moving existing release ${TAG} back to draft for repair."
              gh release edit "${TAG}" --draft --notes-file "${RUNNER_TEMP}/release-notes.md"
            elif [[ "${IS_DRAFT}" == "false" ]]; then
              echo "Release ${TAG} is already published — nothing to do."
              echo 'skip=true' >> "${GITHUB_OUTPUT}"
              exit 0
            else
              gh release edit "${TAG}" --notes-file "${RUNNER_TEMP}/release-notes.md"
            fi
          else
            gh release create "${TAG}" \
              --draft \
              --verify-tag \
              --target "${TARGET_SHA}" \
              --title "${TAG}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md"
          fi

          echo 'skip=false' >> "${GITHUB_OUTPUT}"
          echo "Draft release ${TAG} is ready at ${TARGET_SHA}."

      - name: Dispatch artifact workflows
        id: dispatch
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          UPDATE_FLOATING_TAGS: ${{ github.event_name != 'workflow_dispatch' || inputs.update_floating_tags }}
        run: |
          set -euo pipefail
          RUNS_FILE="${RUNNER_TEMP}/release-workflow-runs"
          : > "${RUNS_FILE}"

          # Dispatch the workflow definitions from main, but tell each one to
          # check out and package the immutable release tag. This is essential
          # when repairing an older tag whose workflow files contain a bug.
          for workflow in docker.yml build-binaries.yml build-hook.yml; do
            args=(
              "${workflow}"
              --ref main
              -f release_tag="${TAG}"
              -f release_run_id="${GITHUB_RUN_ID}"
            )
            if [[ "${workflow}" == "docker.yml" ]]; then
              args+=(-f update_floating_tags="${UPDATE_FLOATING_TAGS}")
            fi
            gh workflow run "${args[@]}"

            RUN_ID=""
            for attempt in $(seq 1 30); do
              RUN_ID=$(gh run list \
                --workflow "${workflow}" \
                --event workflow_dispatch \
                --branch main \
                --limit 20 \
                --json databaseId,displayTitle \
                --jq ".[] | select(.displayTitle == \"${TAG} · release ${GITHUB_RUN_ID}\") | .databaseId" \
                | head -1)
              [[ -n "${RUN_ID}" ]] && break
              sleep 2
            done

            if [[ -z "${RUN_ID}" ]]; then
              echo "Could not find dispatched run for ${workflow}." >&2
              exit 1
            fi

            echo "${workflow} ${RUN_ID}" | tee -a "${RUNS_FILE}"
          done

      - name: Wait for artifact workflows
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          while read -r workflow run_id; do
            echo "Waiting for ${workflow} run ${run_id}..."
            gh run watch "${run_id}" --exit-status
          done < "${RUNNER_TEMP}/release-workflow-runs"

      - name: Verify release assets
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          ASSETS=$(gh release view "${TAG}" --json assets --jq '.assets[].name')

          require_asset() {
            local name="$1"
            if ! grep -Fxq "${name}" <<< "${ASSETS}"; then
              echo "Missing release asset: ${name}" >&2
              return 1
            fi
          }

          for app in ingest github-app; do
            for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
              require_asset "${app}-server-${target}"
            done
          done

          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            require_asset "claude-telemetry-${target}"
          done

          for component in web ingest github-app migrations-runner; do
            require_asset "${component}-${TAG}.tar"
            require_asset "${component}-${TAG}.tar.sha256"
            require_asset "sbom-${component}-${TAG}.json"
          done

          require_asset SHA256SUMS-binaries
          require_asset SHA256SUMS-hook
          require_asset SHA256SUMS-images

          if ! grep -Eq '^web-standalone-.+\.tar\.gz$' <<< "${ASSETS}"; then
            echo "Missing release asset: web-standalone-*.tar.gz" >&2
            exit 1
          fi

          echo "All expected release assets are present."

      - name: Verify GHCR image tags
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          UPDATE_FLOATING_TAGS: ${{ github.event_name != 'workflow_dispatch' || inputs.update_floating_tags }}
        run: |
          set -euo pipefail
          VERSION=${TAG#v}
          MAJOR_MINOR=${VERSION%.*}
          MAJOR=${VERSION%%.*}
          IMAGE_TAGS=("${TAG}" "${VERSION}")
          if [[ "${UPDATE_FLOATING_TAGS}" == "true" ]]; then
            IMAGE_TAGS+=("${MAJOR_MINOR}" "${MAJOR}" latest)
          fi

          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          for component in web ingest github-app migrations-runner; do
            for image_tag in "${IMAGE_TAGS[@]}"; do
              image="ghcr.io/${GITHUB_REPOSITORY}/${component}:${image_tag}"
              echo "Verifying ${image}"
              docker buildx imagetools inspect "${image}" >/dev/null
            done
          done

      - name: Publish GitHub Release
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          UPDATE_FLOATING_TAGS: ${{ github.event_name != 'workflow_dispatch' || inputs.update_floating_tags }}
        run: |
          set -euo pipefail
          if [[ "${UPDATE_FLOATING_TAGS}" == "true" ]]; then
            gh release edit "${TAG}" --draft=false --latest
          else
            gh release edit "${TAG}" --draft=false
          fi
          echo "Published ${TAG} after all artifact workflows succeeded."
