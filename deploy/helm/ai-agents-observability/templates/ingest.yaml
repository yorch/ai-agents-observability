{{- if .Values.ingest.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-agents-observability.fullname" . }}-ingest
  labels:
    {{- include "ai-agents-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingest
spec:
  replicas: {{ .Values.ingest.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-agents-observability.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ingest
  template:
    metadata:
      labels:
        {{- include "ai-agents-observability.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ingest
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ai-agents-observability.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ingest
          image: {{ include "ai-agents-observability.image" (list . .Values.ingest.image) }}
          imagePullPolicy: {{ include "ai-agents-observability.pullPolicy" (list . .Values.ingest.image) }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.ingest.port }}
              protocol: TCP
          env:
            - name: DATABASE_URL
              value: {{ include "ai-agents-observability.databaseUrl" . | quote }}
            - name: NODE_ENV
              value: production
            - name: PORT
              value: {{ .Values.ingest.port | quote }}
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: S3_ENDPOINT
              value: {{ include "ai-agents-observability.s3Endpoint" . | quote }}
            - name: S3_ACCESS_KEY_ID
              value: {{ include "ai-agents-observability.s3AccessKey" . | quote }}
            - name: S3_SECRET_ACCESS_KEY
              value: {{ include "ai-agents-observability.s3SecretKey" . | quote }}
            - name: S3_BUCKET
              value: {{ include "ai-agents-observability.s3Bucket" . | quote }}
            - name: S3_REGION
              value: {{ include "ai-agents-observability.s3Region" . | quote }}
            - name: S3_FORCE_PATH_STYLE
              value: {{ include "ai-agents-observability.s3ForcePathStyle" . | quote }}
            {{- if .Values.secrets.adminSecret }}
            - name: ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.secretName }}
                  key: ADMIN_SECRET
            {{- end }}
            {{- range $k, $v := .Values.ingest.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- with .Values.ingest.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-agents-observability.fullname" . }}-ingest
  labels:
    {{- include "ai-agents-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingest
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.ingest.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ai-agents-observability.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ingest
{{- end -}}
