{{- if .Values.migrations.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ai-agents-observability.fullname" . }}-migrations
  labels:
    {{- include "ai-agents-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  {{- if .Values.migrations.enabled }}
  annotations:
    # Run before app deployments install/upgrade. Helm waits for hooks to
    # complete before proceeding. If the migration fails, the release is in
    # a half-installed state — run `helm rollback` and check the job logs.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  {{- end }}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "ai-agents-observability.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ai-agents-observability.serviceAccountName" . }}
      containers:
        - name: migrations
          image: {{ include "ai-agents-observability.image" (list . .Values.migrations.image) }}
          imagePullPolicy: {{ include "ai-agents-observability.pullPolicy" (list . .Values.migrations.image) }}
          env:
            - name: DATABASE_URL
              value: {{ include "ai-agents-observability.databaseUrl" . | quote }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end -}}
