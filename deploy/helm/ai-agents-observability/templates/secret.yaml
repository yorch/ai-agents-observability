{{- if not .Values.secrets.useExistingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.secretName }}
  labels:
    {{- include "ai-agents-observability.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_ED25519_PRIVATE_KEY: {{ .Values.secrets.jwtPrivateKey | quote }}
  JWT_ED25519_PUBLIC_KEY: {{ .Values.secrets.jwtPublicKey | quote }}
  GITHUB_OAUTH_CLIENT_ID: {{ .Values.secrets.githubOAuthClientId | quote }}
  GITHUB_OAUTH_CLIENT_SECRET: {{ .Values.secrets.githubOAuthClientSecret | quote }}
  GITHUB_HOST: {{ .Values.secrets.githubHost | quote }}
  {{- if .Values.secrets.githubAppId }}
  GITHUB_APP_ID: {{ .Values.secrets.githubAppId | quote }}
  {{- end }}
  {{- if .Values.secrets.githubAppPrivateKey }}
  GITHUB_APP_PRIVATE_KEY: {{ .Values.secrets.githubAppPrivateKey | quote }}
  {{- end }}
  {{- if .Values.secrets.githubAppWebhookSecret }}
  GITHUB_APP_WEBHOOK_SECRET: {{ .Values.secrets.githubAppWebhookSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.adminSecret }}
  ADMIN_SECRET: {{ .Values.secrets.adminSecret | quote }}
  {{- end }}
{{- end -}}
