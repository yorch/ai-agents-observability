services:
  postgres:
    image: timescale/timescaledb:latest-pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_agents_observability}
      # POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_agents_observability}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrations:
    build:
      context: .
      dockerfile: infra/migrations-runner/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_agents_observability}
    restart: "no"

  # Renamed from `minio`. The `minio` network alias below keeps existing
  # S3_ENDPOINT=http://minio:9000 values resolving, but user compose override
  # files that reference the `minio` SERVICE must be renamed to `object-store`
  # (docs/deploy/migrate-from-minio.md).
  object-store:
    image: ${OBJECT_STORE_IMAGE:-dxflrs/garage:v2.4.1}
    # No shell in this image: exec-form only. Single-node mode creates the key
    # and bucket from the GARAGE_DEFAULT_* variables on every start (idempotent).
    command: ["/garage", "-c", "/etc/garage.toml", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-devaccesskey}}
      # Garage requires >= 16 characters. NEVER change this after first boot
      # without rotating the key (garage key delete): a changed secret for an
      # existing key id is fatal and the container crash-loops.
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-devsecretkey-change-me}}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-transcripts}
      # Fixed on purpose; RPC is bound to loopback in garage.toml, so this
      # grants nothing to other containers. Must be exactly 64 hex characters.
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0}
    ports:
      - "${S3_PORT:-${MINIO_PORT:-9000}}:9000"
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - ./data/garage/meta:/var/lib/garage/meta
      - ./data/garage/data:/var/lib/garage/data
    networks:
      default:
        aliases:
          - minio
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    # prometheus.yml scrapes ingest at host.docker.internal:4000, which reaches
    # the ingest port published to the host whether ingest runs natively (pure
    # `docker:infra` dev) or as a container (`docker:app` / prod). This mapping
    # is what makes host.docker.internal resolvable on Linux (Docker Desktop
    # provides it automatically).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.0
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
