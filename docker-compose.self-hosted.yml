# Build-from-source overlay. Layer on top of the infra + prod compose files:
#   just prod-source-up
#
# This overlay replaces the pre-built image references in docker-compose.prod.yml
# with local builds from source. Use it when org policy forbids running images
# from public external registries (GHCR). The org clones the repo at a pinned
# tag, runs the command above, and the stack builds all four images locally.
#
# No outbound image pulls happen — pull_policy is set to "never" and image
# references are cleared. The only network access needed is for the base images
# (oven/bun, node:24-alpine, timescale/timescaledb, quay.io/minio/*) during the
# first build; cache them in a local registry mirror for fully offline builds.
#
# See docs/deploy/build-from-source.md for the full runbook.
services:
  web:
    image: !reset null
    pull_policy: never
    build:
      context: .
      dockerfile: apps/web/Dockerfile

  ingest:
    image: !reset null
    pull_policy: never
    build:
      context: .
      dockerfile: apps/ingest/Dockerfile

  github-app:
    image: !reset null
    pull_policy: never
    build:
      context: .
      dockerfile: apps/github-app/Dockerfile

  migrations:
    image: !reset null
    pull_policy: never
    build:
      context: .
      dockerfile: infra/migrations-runner/Dockerfile
