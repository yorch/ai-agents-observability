# Overlay for deploying behind an existing Traefik instance. Layer it on top of
# the infra + prod compose files (the prod services depend on postgres/minio,
# which are defined in docker-compose.infra.yml):
#   just prod-traefik-up
#
# Assumes Traefik is already running with an external network named `traefik`
# and a `websecure` entrypoint + `webcert` certificate resolver.
# DOMAIN_APP → web, DOMAIN_INGEST → ingest, DOMAIN_GITHUB → GitHub webhooks,
# and DOMAIN_GRAFANA → Grafana.
services:
  postgres:
    ports: !reset []

  minio:
    ports: !reset []

  prometheus:
    ports: !reset []
    volumes:
      - ./infra/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts: !reset []

  grafana:
    ports: !reset []
    networks:
      - default
      - traefik
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "https://${DOMAIN_GRAFANA:?DOMAIN_GRAFANA must be set when using docker-compose.traefik.yml}"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.services.${TRAEFIK_NAME_GRAFANA:-ai-agents-grafana}.loadbalancer.server.port=3000"
      - "traefik.http.routers.${TRAEFIK_NAME_GRAFANA:-ai-agents-grafana}.rule=Host(`${DOMAIN_GRAFANA:?DOMAIN_GRAFANA must be set when using docker-compose.traefik.yml}`) && !Path(`/metrics`)"
      - "traefik.http.routers.${TRAEFIK_NAME_GRAFANA:-ai-agents-grafana}.entrypoints=websecure"
      - "traefik.http.routers.${TRAEFIK_NAME_GRAFANA:-ai-agents-grafana}.tls=true"
      - "traefik.http.routers.${TRAEFIK_NAME_GRAFANA:-ai-agents-grafana}.tls.certResolver=webcert"
      - "traefik.http.routers.${TRAEFIK_NAME_GRAFANA:-ai-agents-grafana}.service=${TRAEFIK_NAME_GRAFANA:-ai-agents-grafana}"

  web:
    # Reached only via Traefik in this overlay — clear the inherited
    # host port mapping from docker-compose.prod.yml.
    ports: !reset []
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.services.${TRAEFIK_NAME_WEB:-ai-agents-web}.loadbalancer.server.port=3000"
      - "traefik.http.routers.${TRAEFIK_NAME_WEB:-ai-agents-web}.rule=Host(`${DOMAIN_APP:?DOMAIN_APP must be set when using docker-compose.traefik.yml}`) && !Path(`/metrics`)"
      - "traefik.http.routers.${TRAEFIK_NAME_WEB:-ai-agents-web}.entrypoints=websecure"
      - "traefik.http.routers.${TRAEFIK_NAME_WEB:-ai-agents-web}.tls=true"
      - "traefik.http.routers.${TRAEFIK_NAME_WEB:-ai-agents-web}.tls.certResolver=webcert"
      - "traefik.http.routers.${TRAEFIK_NAME_WEB:-ai-agents-web}.service=${TRAEFIK_NAME_WEB:-ai-agents-web}"

  ingest:
    ports: !reset []
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.services.${TRAEFIK_NAME_INGEST:-ai-agents-ingest}.loadbalancer.server.port=4000"
      - "traefik.http.routers.${TRAEFIK_NAME_INGEST:-ai-agents-ingest}.rule=Host(`${DOMAIN_INGEST:?DOMAIN_INGEST must be set when using docker-compose.traefik.yml}`) && ((Method(`GET`) && (Path(`/health`) || Path(`/readyz`))) || (Method(`POST`) && (Path(`/v1/events`) || PathPrefix(`/v1/transcripts/`))))"
      - "traefik.http.routers.${TRAEFIK_NAME_INGEST:-ai-agents-ingest}.entrypoints=websecure"
      - "traefik.http.routers.${TRAEFIK_NAME_INGEST:-ai-agents-ingest}.tls=true"
      - "traefik.http.routers.${TRAEFIK_NAME_INGEST:-ai-agents-ingest}.tls.certResolver=webcert"
      - "traefik.http.routers.${TRAEFIK_NAME_INGEST:-ai-agents-ingest}.service=${TRAEFIK_NAME_INGEST:-ai-agents-ingest}"

  github-app:
    # Reached only via Traefik in this overlay — clear the inherited
    # host port mapping from docker-compose.prod.yml.
    ports: !reset []
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.services.${TRAEFIK_NAME_GITHUB:-ai-agents-github}.loadbalancer.server.port=4001"
      - "traefik.http.routers.${TRAEFIK_NAME_GITHUB:-ai-agents-github}.rule=Host(`${DOMAIN_GITHUB:?DOMAIN_GITHUB must be set when using docker-compose.traefik.yml}`) && ((Method(`GET`) && Path(`/health`)) || (Method(`POST`) && Path(`/webhooks/github`)))"
      - "traefik.http.routers.${TRAEFIK_NAME_GITHUB:-ai-agents-github}.entrypoints=websecure"
      - "traefik.http.routers.${TRAEFIK_NAME_GITHUB:-ai-agents-github}.tls=true"
      - "traefik.http.routers.${TRAEFIK_NAME_GITHUB:-ai-agents-github}.tls.certResolver=webcert"
      - "traefik.http.routers.${TRAEFIK_NAME_GITHUB:-ai-agents-github}.service=${TRAEFIK_NAME_GITHUB:-ai-agents-github}"

networks:
  traefik:
    external: true
